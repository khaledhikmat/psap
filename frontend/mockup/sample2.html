<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSAP 2.0 Security Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: tabbed header. Home = two large start boxes. Assessment = progress bar, one question card, details box beside it. */
:root{
  --bg:#edf1f4; --panel:#ffffff; --ink:#14202b; --muted:#566574; --line:#d3dbe2; --soft:#e6ecf1;
  --accent:#0f4c75; --accent-ink:#ffffff; --accent-soft:#dfeaf3; --teal:#0e7c86; --teal-soft:#dcf0f1;
  --lo:#2b7a4b; --lo-bg:#e2f1e7; --md:#a2660a; --md-bg:#fbeed6; --hi:#ad2b25; --hi-bg:#f8e1df;
  --h-lo:#cfe8d7; --h-md:#f4dcab; --h-hi:#efbab5;
  --t1:#ad2b25; --t2:#b4650d; --t3:#1f5f97; --t4:#3d7a51;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c; --panel:#18212a; --ink:#e5ebf0; --muted:#97a6b4; --line:#2b3845; --soft:#202b36;
  --accent:#78b0dc; --accent-ink:#0b141c; --accent-soft:#1b2f41; --teal:#5cc3cb; --teal-soft:#17363a;
  --lo:#6cc492; --lo-bg:#16301f; --md:#e4ab52; --md-bg:#352812; --hi:#ef8780; --hi-bg:#3a1b19;
  --h-lo:#1f4a30; --h-md:#59401a; --h-hi:#5e2521;
  --t1:#ef8780; --t2:#e8a54e; --t3:#78b0dc; --t4:#7cc497; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --panel:#18212a; --ink:#e5ebf0; --muted:#97a6b4; --line:#2b3845; --soft:#202b36;
  --accent:#78b0dc; --accent-ink:#0b141c; --accent-soft:#1b2f41; --teal:#5cc3cb; --teal-soft:#17363a;
  --lo:#6cc492; --lo-bg:#16301f; --md:#e4ab52; --md-bg:#352812; --hi:#ef8780; --hi-bg:#3a1b19;
  --h-lo:#1f4a30; --h-md:#59401a; --h-hi:#5e2521;
  --t1:#ef8780; --t2:#e8a54e; --t3:#78b0dc; --t4:#7cc497; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:20}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:10px}
@media (max-width:600px){.role{margin-left:0;width:100%;justify-content:flex-start}.brand span{display:none}}
.mark{width:38px;height:38px;flex:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px}
.role{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.role button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.role button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.brand b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:8px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs[hidden]{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 56px}
main>section{display:grid;gap:18px;min-width:0}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.teal{background:var(--teal);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,30px);display:grid;gap:16px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:66ch}
.note{font-size:13.5px;color:var(--muted)}

/* home */
.hero{display:grid;gap:8px}
.hero h1{font-size:clamp(30px,5vw,44px)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.start{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:clamp(22px,4vw,36px);display:grid;gap:12px;align-content:start;min-height:250px;transition:border-color .15s,transform .15s}
.start:hover{border-color:var(--accent);transform:translateY(-2px)}
.start .ic{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.start.ex .ic{background:var(--teal-soft);color:var(--teal)}
.start h2{font-size:clamp(26px,3.6vw,34px)}
.start p{color:var(--muted)}
.start .go{font-weight:600;color:var(--accent)}
.start.ex .go{color:var(--teal)}
.start ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:2px}
.recent{display:grid;gap:8px}

/* assessment */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:grid;gap:10px}
.prog-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.prog-top b{font-family:var(--display);font-size:18px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.as span{background:var(--teal)}
.phases{display:flex;flex-wrap:wrap;gap:6px}
.ph{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.ph.on{background:var(--accent);color:var(--accent-ink)}
.ph.as.on{background:var(--teal)}
.ph.done{background:var(--lo-bg);color:var(--lo)}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:860px){.qwrap{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3.5vw,32px);display:grid;gap:18px;min-width:0}
.qcard h2{font-size:clamp(22px,3vw,28px);line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11.5px;background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.role{background:var(--accent-soft)}
.chip.role.as{background:var(--teal-soft)}
.details{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:18px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px)}
.details.as{border-left-color:var(--teal)}
@media (max-width:860px){.details{position:static}}
.details h3{font-size:17px}
.details p,.details li{font-size:14px}
.details ul{margin:0;padding-left:18px;display:grid;gap:6px}
.details .ex{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 14px;font-size:15px;transition:border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt b{font-family:var(--display);font-size:22px;color:var(--accent);text-align:center}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.chk input{width:18px;height:18px;margin-top:2px}
label.f{display:grid;gap:5px;font-size:13.5px;font-weight:600}
.inp{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;font-weight:400;width:100%}
textarea.inp{min-height:110px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.formh{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:4px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.box .k{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.vbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.vb{border:2px solid var(--line);background:var(--bg);border-radius:9px;padding:12px;text-align:left;display:grid;gap:2px}
.vb span{font-size:13px;color:var(--muted)}
.vb[aria-pressed="true"][data-v="confirm"]{border-color:var(--lo);background:var(--lo-bg)}
.vb[aria-pressed="true"][data-v="correct"]{border-color:var(--md);background:var(--md-bg)}
.vb[aria-pressed="true"][data-v="return"]{border-color:var(--hi);background:var(--hi-bg)}
.center{display:grid;gap:14px;justify-items:start;max-width:640px}
.check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--lo-bg);color:var(--lo)}

/* results */
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.v{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.v .k{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.v .big{font-family:var(--display);font-size:36px;font-weight:700;line-height:1.05}
.v .d{font-size:13.5px;color:var(--muted)}
.t1{border-left-color:var(--t1)}.t1 .big,.c1{color:var(--t1)}
.t2{border-left-color:var(--t2)}.t2 .big,.c2{color:var(--t2)}
.t3{border-left-color:var(--t3)}.t3 .big,.c3{color:var(--t3)}
.t4{border-left-color:var(--t4)}.t4 .big,.c4{color:var(--t4)}
.v.hi{border-left-color:var(--hi)}.v.hi .big{color:var(--hi)}
.v.md{border-left-color:var(--md)}.v.md .big{color:var(--md)}
.v.lo{border-left-color:var(--lo)}.v.lo .big{color:var(--lo)}
.v.na{border-left-color:var(--line)}.v.na .big{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-hi{background:var(--hi-bg);color:var(--hi)}.p-md{background:var(--md-bg);color:var(--md)}.p-lo{background:var(--lo-bg);color:var(--lo)}.p-na{background:var(--soft);color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(42px,56px));grid-auto-rows:minmax(38px,46px);gap:3px}
.heat .cell{border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;position:relative}
.heat .c-lo{background:var(--h-lo)}.heat .c-md{background:var(--h-md)}.heat .c-hi{background:var(--h-hi)}
.heat .ax{display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.heat .me{outline:3px solid var(--ink);outline-offset:-3px}
.heat .me::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ink);position:absolute}
.heatwrap{display:grid;gap:6px;justify-items:start}
.axl{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ctl small{display:block;color:var(--muted)}
@media (max-width:520px){.ctl{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-v="Met"]{background:var(--lo);color:var(--panel)}
.seg button[aria-pressed="true"][data-v="Gap"]{background:var(--hi);color:var(--panel)}
.seg button[aria-pressed="true"][data-v="Exception"]{background:var(--md);color:var(--panel)}
.adj{display:flex;gap:6px;flex-wrap:wrap}
.adj button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px}
.adj button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right}
.minw{min-width:620px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;counter-reset:s}
.fs{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:4px;background:var(--panel)}
.fs.as{border-top-color:var(--teal)}
.fs b{font-family:var(--display);font-size:17px}
.fs span{font-size:13px;color:var(--muted)}
.formula{font-family:var(--mono);background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px;overflow-x:auto;white-space:nowrap}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--panel)}
.prose{display:grid;gap:12px;max-width:72ch}
.toast{font-size:13px;color:var(--lo)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="hd"><div class="mark" aria-hidden="true">PSAP</div><div class="brand"><b>PSAP 2.0 Security Assessment</b><span>Physical Security Assessment Program · secure rooms and areas</span></div><div class="role" role="group" aria-label="View as"><span>View as</span><button data-role="aco">ACO / SME</button><button data-role="sec">Physical Security</button></div></div>
    <nav class="tabs" aria-label="Sections">
      <button data-view="home">Home</button><button data-view="process">Process</button><button data-view="launch">LAUNCH</button><button data-view="shield">SHIELD</button><button data-view="tiers">Tiers</button><button data-view="baseline">Baseline</button><button data-view="leadership">Leadership</button><button data-view="governance">Governance</button>
    </nav>
  </div>
</header>
<main class="wrap"><section id="view"></section></main>

<script>
/* ======================= content ======================= */
const FUNCS=["Safekeeping of valuables (i.e., currency, IT equipment)","High dollar asset storage (not affixed to room)","Data Transmission / Network infrastructure","Data Storage","Sensitive Business Operations (i.e., member data, fraud)","Building Infrastructure (Water, Electrical, HVAC)","Executive Leadership Team (ELT) area","Physical security operations","Life-safety systems","Other"];
const Q_ACCESS={id:"ACC",num:4,name:"Routine Access",q:"How limited is the legitimate business population requiring access to this asset?",a:["Broad business population: no access restrictions","Defined business population: all badged employees and contractors","Limited business population: badged employees only","Restricted access population: access limited to a small number of specifically approved individuals","Highly restricted access only: normally limited to very few individuals and may require approval for a specific purpose each time"],
 d:{what:"Who normally needs to get into this room to do their job. This question is not scored. The assessor uses it to check the access list.",how:["Count only people with a business reason to enter, not everyone who currently has badge access.","If access is approved case by case, choose 5."],ex:["Any badged employee can enter → 3","Four named IT staff only → 4","Vault opened only with dual approval each time → 5"]}};
const LAUNCH=[
 {id:"Q5",num:5,name:"Asset Type",w:20,q:"What type of assets are housed in this room or area? Answer for the highest-criticality asset, system or information actually housed in the room.",a:["General office equipment or supplies","Department-specific equipment, records or resources","Shared business systems or sensitive information","Association systems, security systems or regulated information","Mission-critical infrastructure, life-safety systems or highly sensitive assets"],ev:"Asset inventory",
  d:{what:"The most important thing kept in the room. Answer for the single highest item, not the average of everything in the room.",how:["Walk the room in your head and pick the item whose loss would hurt most.","Evidence: an asset inventory or equipment list."],ex:["Supply closet with paper and toner → 1","Room with supplies and the site's only network switch → answer for the switch: 4","Fire alarm panel or main electrical gear → 5"]},
  v:"Compare the answer with the asset inventory. If the inventory shows a more critical asset than the ACO chose, correct it upward."},
 {id:"Q6",num:6,name:"Business Dependency",w:25,q:"How dependent are daily business operations on this room or area?",a:["Minimal: convenience function only","Limited: supports a single team or department","Moderate: supports multiple departments or a business function","Significant: supports critical business operations or major site functions","Severe: supports Association-wide operations or could cause major business interruption"],ev:"Dependency map or BIA",
  d:{what:"How much work stops if nobody can use this room for a day.",how:["Think about who calls the help desk first when the room goes down.","Evidence: a dependency map or business impact analysis (BIA)."],ex:["Break room → 1","One team's file room → 2","Main network room for the whole site → 4","Data center serving every office → 5"]},
  v:"Check the dependency map or BIA. If neither exists, confirm with the ACO's manager and note it."},
 {id:"Q7",num:7,name:"Recovery Capability",w:20,q:"If this room or area became unavailable, how quickly could operations be restored using existing recovery plans, redundancies or alternate locations?",a:["Within hours","Within 1 day","Within 1 week","Within 1 month","More than 1 month or no practical recovery option"],ev:"Business continuity plan",
  d:{what:"How long until the work this room supports is running again somewhere else.",how:["Use the business continuity plan (BCP), not a best guess.","If there is no written plan, choose 5."],ex:["Work moves to laptops at home the same day → 1","Equipment can be reordered and installed within a week → 3","No alternate site and custom equipment → 5"]},
  v:"Open the BCP and find the recovery time for this function. If the BCP says longer than the ACO did, correct it."},
 {id:"Q8",num:8,name:"Unauthorized Access Impact",w:25,q:"What could be the impact if assets, systems, information or equipment in this room were accessed by an unauthorized person?",a:["No meaningful impact","Limited impact to a small workgroup","Moderate impact to a department or business function","Significant impact to multiple departments, a site or customers","Severe enterprise, regulatory, financial or reputational impact"],ev:"Data classification",
  d:{what:"The damage if the wrong person got in and could see, take or change what is inside.",how:["Consider theft, tampering and simply viewing information.","Evidence: the data classification of anything stored or processed here."],ex:["Office supplies → 1","Department budget files → 3","Member records or payment data → 5"]},
  v:"Check the data classification records. Regulated or restricted data in the room means 4 or 5."},
 {id:"Q9",num:9,name:"Backup / Alternate Resources",w:10,q:"Are backup systems or alternate resources available if a primary system or component in this room fails?",a:["Full redundancy: continuity with little or no interruption","High redundancy: backup available with minimal downtime","Moderate redundancy: backups exist, but single points of failure remain","Limited redundancy: some backup capability exists but recovery requires significant effort","No redundancy: critical functions depend on a single point of failure"],ev:"DR runbook or test record",
  d:{what:"Whether a working backup exists if equipment in this room fails.",how:["Count only backups that exist today and have been tested.","A planned backup that is not installed counts as none."],ex:["Automatic failover to a second data center → 1","Spare switch on the shelf, manual swap → 3","One circuit, no spare, no failover → 5"]},
  v:"Ask for the last failover or restore test. No test record means the backup is unproven; consider correcting upward."}
];
const SHIELD=[

/* ======================= scoring ======================= */
const wsum=(set,ans)=>{let s=0;for(const q of set){if(!ans[q.id])return null;s+=ans[q.id]*q.w}return s/100};
const conf=id=>A.c[id];
const confAns=()=>{const o={};LAUNCH.forEach(q=>{o[q.id]=conf(q.id)});return o};
const shieldScore=ans=>{let s=0;for(const q of SHIELD){if(!ans[q.id])return null;s+=(ans[q.id]-1)/4*q.w}return s};
const tierOf=c=>c>=4?1:c>=3?2:c>=2?3:4;
const bandOf=r=>r>60?"hi":r>=30?"md":"lo";
const shBand=x=>x<20?"Low":x<40?"Moderate":x<62.5?"Elevated":"High";
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const tierScore=(C,T)=>C*0.7+T*0.3;
function scores(){
  const Cown=wsum(LAUNCH,A.c),C=wsum(LAUNCH,confAns()),T=wsum(THREAT,A.t);
  const TS=(C!=null&&T!=null)?tierScore(C,T):null,TSown=(Cown!=null&&T!=null)?tierScore(Cown,T):null;
  const tc=TS==null?null:tierOf(TS),tier=tc==null?null:clamp(tc-A.adj.d,1,4);
  const SH=A.mode==="new"?null:shieldScore(A.s),V=SH==null?null:1+SH/25;
  const R=(C!=null&&T!=null&&V!=null)?C*T*V:null,L=(T!=null&&V!=null)?Math.sqrt(T*V):null;
  return{Cown,C,T,TS,TSown,tc,tier,SH,V,R,L,band:R==null?null:bandOf(R)};
}

function assess(){
  const S=screens();A.i=clamp(A.i,0,S.length-1);
  if(ROLE==="aco"&&S[A.i].role==="as"){document.querySelector("nav.tabs").hidden=false;V(`<div class="panel"><div class="center"><span class="check">${ICON.ok}</span><div class="eyebrow">Submitted ${esc(A.req.date)}</div><h2>Your request is with Physical Security</h2>

   <button class="btn" id="hm">Return home</button><p class="note">Demo: switch to Physical Security view at the top to continue as the assessor.</p></div></div>`);$("hm").onclick=()=>go("home");return}
  const sc=S[A.i];
  const roleScreens=S.filter(x=>x.role===sc.role),pos=roleScreens.indexOf(sc)+1,pct=Math.round(pos/roleScreens.length*100);
  const curP=PHASES().findIndex(p=>p[0]===sc.p);
  const top=`<div class="prog"><div class="prog-top"><b>${sc.role==="aco"?"ACO / Subject Matter Expert (SME)":"Physical Security assessor"}</b><span class="note num">${esc(A.req.room||"New request")} · ${A.mode==="new"?"New room":"Existing room"} · step ${pos} of ${roleScreens.length}</span></div>
   <div class="bar${sc.role==="as"?" as":""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
   <div class="phases">${PHASES().map((p,i)=>`<span class="ph${p[2]==="as"?" as":""}${i===curP?" on":i<curP?" done":""}">${p[1]}</span>`).join("")}</div></div>`;
  document.querySelector("nav.tabs").hidden=sc.role==="aco";
  const body=({request:sRequest,funcs:sFuncs,desc:sDesc,lrr:sLrr,acc:sAcc,launch:sLaunch,submit:sSubmit,handoff:sHandoff,review:sReview,tier:sTier,shield:sShield,threat:sThreat,report:sReport})[sc.k](sc);
  V(top+body.html);wireNav(body.ok);body.wire&&body.wire();
}

function flags(){

  if(c.Q6>=4&&c.Q5<=2)add(["Q5","Q6"],`Business Dependency is rated ${c.Q6}, but Asset Type is rated ${c.Q5}.`);
  if(F.some(i=>[3,4].includes(i))&&c.Q8<=2)add(["Q8"],`The room holds data or sensitive operations, but Unauthorized Access Impact is rated ${c.Q8}.`);
  if(A.lrr.flag==="yes"&&c.Q8<=2)add(["Q8"],`A legal or regulatory requirement was identified, but Unauthorized Access Impact is rated ${c.Q8}.`);

  <div class="nav" style="justify-content:flex-start"><button class="btn ghost" id="back">Back</button><button class="btn" id="save">Save to Leadership view</button><button class="btn ghost" id="copy">Copy summary</button><button class="btn ghost" id="home">Home</button><span class="toast" id="toast" role="status"></span></div></div>`;
  return{ok:()=>true,html,wire:()=>{
    document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{A.ctl[b.dataset.c]=b.dataset.v;const y=scrollY;assess();scrollTo(0,y)});
    $("save").onclick=()=>{const row={room:A.req.room,office:A.req.office,C:X.C,T:X.T,V:X.V,SH:X.SH,sh:SHIELD.map(q=>A.s[q.id]),gaps,tier:t,TS:X.TS,R:X.R,L:X.L};SAVED=SAVED.filter(r=>!(r.room===row.room&&r.office===row.office));SAVED.unshift(row);persist();$("toast").textContent="Saved on this device."};
    $("copy").onclick=async()=>{const txt=[`PSAP 2.0 assessment: ${A.req.room} (${A.req.office})`,`Date ${A.req.date} · Assessor ${A.assessor}`,`Tier ${t} (${TIERNAME[t]}), tier score ${X.TS.toFixed(2)} = LAUNCH ${X.C.toFixed(2)} × 0.7 + threat ${X.T.toFixed(2)} × 0.3`,
      isNew?"SHIELD and risk: after install":`Risk ${Math.round(X.R)}/125 ${BAND[X.band][0]}; SHIELD ${X.SH.toFixed(1)} ${shBand(X.SH)}`,
      `Controls: ${R.length-gaps-exc} met, ${gaps} gaps, ${exc} exceptions`,...R.filter(r=>A.ctl[r.k]!=="Met").map(r=>`- ${A.ctl[r.k]}: ${r.name}`)].join("\n");
      try{await navigator.clipboard.writeText(txt);$("toast").textContent="Summary copied."}catch(e){$("toast").textContent="Copy was blocked. Select the audit record and copy it."}};
    $("home").onclick=()=>go("home");
  }};
}

/* ======================= reference tabs ======================= */
function page(eyebrow,title,lead,body){V(`<div class="panel"><div class="eyebrow">${eyebrow}</div><h1 style="font-size:clamp(26px,4vw,36px)">${title}</h1>${lead?`<p class="lead">${lead}</p>`:""}${body}</div>`)}
function process(){page("Process","How an assessment moves","Each step has one owner. The ACO describes the room; Physical Security owns the tier and the site assessment.",
 `<div class="flow">${[["1. Request","ACO","Requestor, LOB, FCC and room details.","aco"],["2. LAUNCH","ACO / SME","Four context questions and five scored questions with evidence, then a signed attestation.","aco"],["3. Assessor review","Assessor","One screen: the tool flags only contradictions; accept or return.","as"],["4. Threat questions","Assessor","Incidents and documented threats in 12 months, CAP Index crime score, access population.","as"],["5. Tier","Assessor","LAUNCH × 70% + threat × 30%; one-level move only with approval.","as"],["6. SHIELD","Assessor on site","Nine exposure factors with photo or record evidence. Existing rooms only.","as"],["7. Result","All","Risk score, heat map, required controls and gaps.","as"]].map(x=>`<div class="fs${x[3]==="as"?" as":""}"><b>${x[0]}</b><span><b>${x[1]}</b></span><span>${x[2]}</span></div>`).join("")}</div>
 <p class="note">New rooms stop after the tier: the result lists the controls to install. SHIELD runs once the room is built.</p>`)}
function pLaunch(){page("LAUNCH","Criticality questions","Answered by the ACO/SME with evidence and a signed attestation, then checked by the assessor. Questions 1 to 4 give context and are not scored. LAUNCH is 70% of the tier score.",
 `<div class="tw"><table class="minw"><thead><tr><th>#</th><th>Question</th><th class="r">Weight</th></tr></thead><tbody>
 <tr><td>1</td><td>What functions does this room support? (Select all that apply)</td><td class="r">Context</td></tr><tr><td>2</td><td>Describe the contents and main use of the room.</td><td class="r">Context</td></tr>
 <tr><td>3</td><td>Are there any legal, regulatory, or business requirements that require physical security measures for this room or area?</td><td class="r">Flag</td></tr><tr><td>4</td><td>${esc(Q_ACCESS.q)}</td><td class="r">Context</td></tr>
 ${LAUNCH.map(q=>`<tr><td>${q.num}</td><td><b>${q.name}.</b> ${esc(q.q)}</td><td class="r num">${q.w}%</td></tr>`).join("")}</tbody></table></div>
 <div class="formula">Criticality = Q5×0.20 + Q6×0.25 + Q7×0.20 + Q8×0.25 + Q9×0.10   (each answer 1–5)</div>`)}
function pShield(){page("SHIELD","Exposure factors","Scored on site by the assessor. Each factor earns part of its points from 1 (lowest exposure) to 5 (highest). SHIELD never changes the tier.",
 `<div class="tw"><table class="minw"><thead><tr><th>Factor</th><th>Scoring rule</th><th class="r">Points</th></tr></thead><tbody>${SHIELD.map(q=>`<tr><td><b>${q.name}</b></td><td>${esc(q.d.rule)}</td><td class="r num">${q.w}</td></tr>`).join("")}</tbody></table></div>
 <div class="formula">SHIELD = Σ (answer − 1) ÷ 4 × points   (0–100)</div><p>Low under 20 · Moderate 20 to under 40 · Elevated 40 to under 62.5 · High 62.5 and above.</p>`)}
function tiers(){page("Tiers","Tier definitions","The tier fixes what a room must have. It combines the ACO/SME's LAUNCH answers (70%) with the assessor's four threat questions (30%). SHIELD never changes the tier.",
 `<div class="verdict">${[1,2,3,4].map(t=>`<div class="v t${t}"><span class="k">${t===1?"4.00 and above":t===2?"3.00 to 3.99":t===3?"2.00 to 2.99":"Below 2.00"}</span><span class="big">Tier ${t}</span><span class="d">${TIERNAME[t]}. Reassess ${REVIEW[t]}.</span></div>`).join("")}</div>
 <div class="formula">Tier score = LAUNCH × 0.7 + Threat × 0.3</div>
 <div class="tw"><table class="minw"><thead><tr><th>Threat question (assessor)</th><th class="r">Weight</th></tr></thead><tbody>${THREAT.map(q=>`<tr><td><b>${q.id} · ${q.name}.</b> ${esc(q.q)}</td><td class="r num">${q.w}%</td></tr>`).join("")}</tbody></table></div>
 <p>The assessor may move a tier one level for a documented factor the questions miss. A reason and a named approver are required.</p>`)}
function baseline(){page("Baseline","Required controls by tier","Controls are cumulative. Each is Met, a Gap with an owner and due date, or an approved Exception. LRR requirements are added to the room's list.",
 `<div class="tw"><table class="minw"><thead><tr><th>Control</th>${[1,2,3,4].map(t=>`<th class="c${t}">Tier ${t}</th>`).join("")}</tr></thead><tbody>${CTRL.map(c=>`<tr><td><b>${c.name}</b></td>${[1,2,3,4].map(t=>`<td>${c.t[t]||"–"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)}
let LT="all",LS={k:"R",d:-1};
function leadership(){
  const all=[...SAVED,...SAMPLE].filter(r=>r.R!=null).map(r=>({...r,band:bandOf(r.R)}));
  const rows=LT==="all"?all:all.filter(r=>r.tier===+LT);
  const counts={};rows.forEach(r=>{const k=clamp(Math.round(r.C),1,5)+"-"+clamp(Math.round(r.L),1,5);counts[k]=(counts[k]||0)+1});
  const avg=(a,f)=>a.length?a.reduce((t,r)=>t+f(r),0)/a.length:null;
  const summ=[1,2,3,4].map(t=>{const g=all.filter(r=>r.tier===t);return{t,n:g.length,ts:avg(g,r=>r.TS),risk:avg(g,r=>r.R),sh:avg(g,r=>r.SH),hi:g.filter(r=>r.band==="hi").length,md:g.filter(r=>r.band==="md").length,lo:g.filter(r=>r.band==="lo").length,gaps:g.reduce((x,r)=>x+(r.gaps||0),0)}});
  const key=(r,k)=>k==="room"?r.room:k==="tier"?r.tier:k==="R"?r.R:k==="SH"?r.SH:k==="gaps"?(r.gaps||0):(r.sh?r.sh[+k]:0);
  const sorted=[...rows].sort((a,b)=>{const x=key(a,LS.k),y=key(b,LS.k);return typeof x==="string"?LS.d*x.localeCompare(y):LS.d*(x-y)});
  const ar=k=>LS.k===k?(LS.d<0?" ▼":" ▲"):"";
  const hv=v=>v<=2?"var(--h-lo)":v===3?"var(--h-md)":"var(--h-hi)";
  const fav=SH_SHORT.map((_,i)=>avg(rows.filter(r=>r.sh),r=>r.sh[i]));
  page("Leadership","Where to invest first","Compare tiers side by side, then drill into one tier factor by factor. The tier says what each room must have. Risk and SHIELD factors show where to spend first.",
  `<p class="note"><span class="tag">Example</span> Rooms marked Example are sample data. Rooms saved from a result appear here on this device.</p>
  <h3 style="font-size:20px">Tier comparison</h3>
  <div class="tw"><table class="minw"><thead><tr><th>Tier</th><th class="r">Rooms</th><th class="r">Avg tier score</th><th class="r">Avg risk</th><th class="r">Avg SHIELD</th><th>Risk bands</th><th class="r">Open gaps</th></tr></thead><tbody>
  ${summ.map(x=>`<tr><td class="c${x.t}"><b>Tier ${x.t}</b> <span class="note">${TIERNAME[x.t]}</span></td><td class="r num">${x.n}</td><td class="r num">${f2(x.ts)}</td><td class="r num">${x.risk==null?"–":Math.round(x.risk)}</td><td class="r num">${x.sh==null?"–":x.sh.toFixed(1)}</td>
   <td>${x.n?`<span class="pill p-hi">${x.hi} High</span> <span class="pill p-md">${x.md} Med</span> <span class="pill p-lo">${x.lo} Low</span>`:"–"}</td><td class="r num">${x.gaps}</td></tr>`).join("")}</tbody></table></div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span class="eyebrow">Show</span><div class="adj" role="group" aria-label="Tier shown">${["all",1,2,3,4].map(t=>`<button data-lt="${t}" aria-pressed="${String(LT)===String(t)}">${t==="all"?"All tiers":"Tier "+t}</button>`).join("")}</div></div>
  <div class="two">${heatHTML(null,counts)}<div class="prose"><h3 style="font-size:19px">${LT==="all"?"All tiers":"Tier "+LT}: ${rows.length} room${rows.length===1?"":"s"}</h3><p>Each number is the count of rooms in that cell. Upper right is where loss would hurt most and an attempt is most likely.</p>
   <p>${["hi","md","lo"].map(b=>`<span class="pill p-${b}">${BAND[b][0]}: ${rows.filter(r=>r.band===b).length}</span>`).join(" ")}</p></div></div>
  <h3 style="font-size:20px">SHIELD factors by room</h3><p class="note">Click a column heading to sort. 1–2 lower exposure, 3 moderate, 4–5 higher exposure. High Entry and Time point to hardening and detection; high Human and Ext point to visitor management and opening protection.</p>
  <div class="tw"><table style="min-width:900px"><thead><tr><th style="cursor:pointer" data-sk="room">Room${ar("room")}</th><th style="cursor:pointer" data-sk="tier">Tier${ar("tier")}</th>${SH_SHORT.map((n,i)=>`<th class="r" style="cursor:pointer" data-sk="${i}" title="${esc(SHIELD[i].name)}">${n}${ar(String(i))}</th>`).join("")}<th class="r" style="cursor:pointer" data-sk="SH">SHIELD${ar("SH")}</th><th class="r" style="cursor:pointer" data-sk="R">Risk${ar("R")}</th><th class="r" style="cursor:pointer" data-sk="gaps">Gaps${ar("gaps")}</th></tr></thead><tbody>
  ${sorted.map(r=>`<tr><td><b>${esc(r.room)}</b>${r.example?' <span class="tag">Example</span>':""}<br><span class="note">${esc(r.office)}</span></td><td class="c${r.tier}" style="white-space:nowrap"><b>Tier ${r.tier}</b></td>
   ${SH_SHORT.map((_,i)=>{const v=r.sh?r.sh[i]:null;return `<td class="r num" style="${v?`background:${hv(v)}`:""}">${v??"–"}</td>`}).join("")}
   <td class="r num">${r.SH==null?"–":r.SH.toFixed(0)}<br><span class="note">${r.SH==null?"":shBand(r.SH)}</span></td><td class="r"><span class="pill p-${r.band}">${Math.round(r.R)}</span></td><td class="r num">${r.gaps||0}</td></tr>`).join("")||`<tr><td colspan="14">No rooms in this tier yet.</td></tr>`}
  ${rows.length?`<tr><td><b>${LT==="all"?"Average":"Tier "+LT+" average"}</b></td><td></td>${fav.map(v=>`<td class="r num" style="${v!=null?`background:${hv(Math.round(v))}`:""}"><b>${v==null?"–":v.toFixed(1)}</b></td>`).join("")}<td class="r num"><b>${avg(rows,r=>r.SH).toFixed(0)}</b></td><td class="r num"><b>${Math.round(avg(rows,r=>r.R))}</b></td><td class="r num"><b>${rows.reduce((x,r)=>x+(r.gaps||0),0)}</b></td></tr>`:""}
  </tbody></table></div>
  ${SAVED.length?`<div><button class="btn ghost" id="clr">Remove my saved rooms</button></div>`:""}`);
  document.querySelectorAll("[data-lt]").forEach(b=>b.onclick=()=>{LT=b.dataset.lt;const y=scrollY;leadership();scrollTo(0,y)});
  document.querySelectorAll("[data-sk]").forEach(h=>h.onclick=()=>{const k=h.dataset.sk;if(LS.k===k)LS.d*=-1;else{LS.k=k;LS.d=k==="room"?1:-1}const y=scrollY;leadership();scrollTo(0,y)});
  if($("clr"))$("clr").onclick=()=>{SAVED=[];persist();leadership()};
}
function governance(){page("Governance","Roles, evidence and approvals","",
 `<div class="tw"><table class="minw"><thead><tr><th>Role</th><th>Responsibility</th></tr></thead><tbody>
  <tr><td><b>ACO / Subject Matter Expert (SME)</b></td><td>Submits the request, answers LAUNCH with evidence and attests that the answers are accurate. Keeps the access list current.</td></tr>
  <tr><td><b>Business Owner</b></td><td>Accountable for the room. Signs risk acceptances for Medium findings not fixed within 12 months.</td></tr>
  <tr><td><b>Physical Security assessor</b></td><td>Reviews flagged LAUNCH answers, and completes SHIELD on site.</td></tr>
  <tr><td><b>Physical Security assessor</b></td><td>Answers the four threat questions (30% of the tier) from incident, threat, CAP Index and access records.</td></tr>
  <tr><td><b>STAT</b></td><td>Selects, installs and tests controls to close gaps.</td></tr>
  <tr><td><b>PSD / AVP</b></td><td>Approve exceptions and any one-level tier move.</td></tr></tbody></table></div>
 <div class="prose"><p><b>Evidence.</b> The ACO/SME lists supporting evidence where it exists and attests to the answers. The assessor reviews only answers that contradict each other.</p>
 <p><b>Risk bands.</b> Over 60 is High: remediation plan within 90 days. 30 to 60 is Medium: fix within 12 months or a signed risk acceptance. Under 30 is Low: maintain.</p>
 <div class="formula">Tier score = LAUNCH × 0.7 + Threat × 0.3 · Risk = LAUNCH × Threat × (1 + SHIELD ÷ 25)   (1–125)</div>
 <p class="note">Weights, cutoffs, bands and the control baseline are proposed values for pilot and leadership approval.</p></div>`)}

let start="home";try{start=location.hash.slice(1)||"home"}catch(e){}
go(start);
</script>
